name: CI Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop

jobs:
  api-tests-only:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: "Task Management API"
      API_V1_STR: "/api/v1"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
      DESCRIPTION: "API for managing tasks and users"
      DEBUG: false
      APP_HOST_PORT: 8080
      MODE: TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "DB is ready" && exit 0
            echo "Waiting for DB..."
            sleep 3
          done
          echo "DB did not become available in time" && exit 1

      - name: Apply migrations
        env:
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

      - name: Run API tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -vv tests/test_api.py


  all-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: "Task Management API"
      API_V1_STR: "/api/v1"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
      DESCRIPTION: "API for managing tasks and users"
      DEBUG: false
      APP_HOST_PORT: 8080
      MODE: TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "DB is ready" && exit 0
            echo "Waiting for DB..."
            sleep 3
          done
          echo "DB did not become available in time" && exit 1

      - name: Apply migrations
        env:
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

      - name: Run all tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -vv
